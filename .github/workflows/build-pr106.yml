name: LibreELEC PR106 AMD test update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Network preflight (DNS and HTTPS)
        run: |
          set -euo pipefail
          echo "Runner: $(lsb_release -ds)"
          for host in github.com archive.ubuntu.com security.ubuntu.com; do
            if ! timeout 15 getent ahostsv4 "$host"; then
              echo "::error::Runner DNS cannot resolve $host. Do not retry apt; use another runner/network."
              exit 1
            fi
          done
          for url in https://github.com/ https://archive.ubuntu.com/ubuntu/dists/jammy/InRelease; do
            curl --fail --location --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null "$url" ||
              { echo "::error::Runner cannot download $url"; exit 1; }
          done
      - name: Prepare build disk
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          # GitHub's Ubuntu runner may use mirror+file:/etc/apt/apt-mirrors.txt
          # pointing at azure.archive.ubuntu.com; do not inherit that mirror.
          source /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://archive.ubuntu.com/ubuntu/' \
            "Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports" \
            'Components: main restricted universe multiverse' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            '' \
            'Types: deb' \
            'URIs: https://security.ubuntu.com/ubuntu/' \
            "Suites: ${VERSION_CODENAME}-security" \
            'Components: main restricted universe multiverse' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            | sudo tee /etc/apt/sources.list.d/ubuntu.sources
          # Remove runner-specific mirror indirection and superseded Ubuntu sources.
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo touch /etc/apt/sources.list
          sudo sed -i '/^[[:space:]]*deb .*ubuntu.com/d' /etc/apt/sources.list
          sudo apt-get clean
          # Check DNS before apt's lengthy retries so the failure is obvious.
          getent ahostsv4 archive.ubuntu.com
          getent ahostsv4 security.ubuntu.com
          packages=(
            bc bison build-essential bzip2 ccache curl flex gawk gcc g++ git
            gperf gzip libdrm-dev libelf-dev libncurses-dev libssl-dev
            make patch perl python3 python3-pip rsync tar unzip wget
            xz-utils zip zstd autopoint gettext libtool pkg-config
            libxml2-utils xsltproc meson ninja-build
          )
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=1 -o APT::Update::Error-Mode=any update &&
               sudo env DEBIAN_FRONTEND=noninteractive apt-get \
                 -o Acquire::Retries=1 -o Acquire::http::Timeout=30 \
                 -o Acquire::https::Timeout=30 install -y "${packages[@]}"; then
              exit 0
            fi
            echo "Ubuntu package attempt ${attempt}/3 failed"
            sleep 10
          done
          exit 1

      - name: Checkout reviewed PR 106 revision
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/CroqueMr/libreelec-x86-DV.git le
          cd le
          git fetch origin refs/pull/106/head:refs/remotes/origin/pr106
          HEAD_SHA="$(git rev-parse refs/remotes/origin/pr106)"
          echo "PR_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
          [[ "$HEAD_SHA" == f48accba93b374e369b46dae18ac6530b3062688 ]] || { echo 'PR #106 changed; review before building'; exit 1; }
          git checkout --detach "$HEAD_SHA"
          git log -1 --oneline
          git diff --check

      - name: Verify and stage CB1
        working-directory: le
        run: |
          set -euxo pipefail
          python3 CB1/tools/verify.py
          python3 scripts/cb1-stage.py --check
          python3 scripts/cb1-stage.py

      - name: Build LibreELEC Generic x86_64
        working-directory: le
        env:
          PROJECT: Generic
          ARCH: x86_64
          OFFICIAL: 'no'
          CB1_HDR10_AI: 'yes'
        run: |
          set -euxo pipefail
          make image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          df -h

      - name: Find and validate update archive
        run: |
          set -euxo pipefail
          mkdir -p output
          mapfile -d '' candidates < <(find le/target -type f -name 'LibreELEC-*.tar' -print0)
          if (( ${#candidates[@]} != 1 )); then
            printf 'Expected exactly one LibreELEC update tar; found %s\n' "${#candidates[@]}"
            find le/target -maxdepth 3 -type f -printf '%p\n' || true
            exit 1
          fi
          cp "${candidates[0]}" output/
          tar -tf "output/$(basename "${candidates[0]}")" >/dev/null
          sha256sum output/*.tar | tee output/SHA256SUMS
          printf 'PR_HEAD=%s\n' "$PR_HEAD" > output/BUILD_SOURCE.txt

      - name: Upload update artifact
        uses: actions/upload-artifact@v4
        with:
          name: libreelec-pr106-generic-x86_64-update
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload log if failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr106-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
