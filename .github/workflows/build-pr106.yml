name: LibreELEC PR106 AMD test update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare build disk
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential bzip2 ccache curl flex gawk gcc g++ git \
            gperf gzip libdrm-dev libelf-dev libncurses-dev libssl-dev \
            make patch perl python3 python3-pip rsync tar unzip wget \
            xz-utils zip zstd autopoint gettext libtool pkg-config \
            libxml2-utils xsltproc meson ninja-build

      - name: Checkout reviewed PR 106 revision
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/CroqueMr/libreelec-x86-DV.git le
          cd le
          git fetch origin refs/pull/106/head:refs/remotes/origin/pr106
          HEAD_SHA="$(git rev-parse refs/remotes/origin/pr106)"
          echo "PR_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
          [[ "$HEAD_SHA" == f48accba93b374e369b46dae18ac6530b3062688 ]] || { echo 'PR #106 changed; review before building'; exit 1; }
          git checkout --detach "$HEAD_SHA"
          git log -1 --oneline
          git diff --check

      - name: Verify and stage CB1
        working-directory: le
        run: |
          set -euxo pipefail
          python3 CB1/tools/verify.py
          python3 scripts/cb1-stage.py --check
          python3 scripts/cb1-stage.py

      - name: Build LibreELEC Generic x86_64
        working-directory: le
        env:
          PROJECT: Generic
          ARCH: x86_64
          OFFICIAL: 'no'
          CB1_HDR10_AI: 'yes'
        run: |
          set -euxo pipefail
          make image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          df -h

      - name: Find and validate update archive
        run: |
          set -euxo pipefail
          mkdir -p output
          mapfile -d '' candidates < <(find le/target -type f -name 'LibreELEC-*.tar' -print0)
          if (( ${#candidates[@]} != 1 )); then
            printf 'Expected exactly one LibreELEC update tar; found %s\n' "${#candidates[@]}"
            find le/target -maxdepth 3 -type f -printf '%p\n' || true
            exit 1
          fi
          cp "${candidates[0]}" output/
          tar -tf "output/$(basename "${candidates[0]}")" >/dev/null
          sha256sum output/*.tar | tee output/SHA256SUMS
          printf 'PR_HEAD=%s\n' "$PR_HEAD" > output/BUILD_SOURCE.txt

      - name: Upload update artifact
        uses: actions/upload-artifact@v4
        with:
          name: libreelec-pr106-generic-x86_64-update
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload log if failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr106-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
